<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#070b18" />
    <title>Page Not Found | Motify</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #070b18;
        color: #f5f7fb;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        background: #070b18;
      }

      header {
        position: absolute;
        z-index: 2;
        top: 0;
        left: 0;
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        padding: 1.4rem clamp(1.25rem, 4vw, 4rem);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        color: #f5f7fb;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-decoration: none;
      }

      .brand img { width: 2rem; height: 2rem; }

      header > a:last-child {
        color: #aeb5c2;
        font-size: 0.9rem;
        text-decoration: none;
      }

      main {
        display: grid;
        min-height: 100vh;
        padding: 8rem 1.5rem 5rem;
        place-content: center;
        text-align: center;
      }

      .code {
        margin: 0;
        color: #ffffff;
        font-size: clamp(7rem, 22vw, 14rem);
        font-weight: 750;
        letter-spacing: -0.09em;
        line-height: 0.72;
      }

      h1 {
        margin: 2.5rem 0 0;
        font-size: clamp(2.35rem, 6vw, 4.75rem);
        letter-spacing: -0.055em;
        line-height: 1;
      }

      .copy {
        max-width: 36rem;
        margin: 1.35rem auto 0;
        color: #9ca4b2;
        font-size: 1.05rem;
        line-height: 1.65;
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      .actions a {
        padding: 0.85rem 1.25rem;
        border: 1px solid #2c3038;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 750;
        letter-spacing: 0.045em;
        text-decoration: none;
        text-transform: uppercase;
        transition: transform 180ms ease, filter 180ms ease;
      }

      .actions a:first-child { background: #f5f7fb; color: #070b18; }
      .actions a:last-child { background: rgba(255, 255, 255, 0.04); color: #f5f7fb; }
      .actions a:hover { filter: brightness(1.08); transform: translateY(-2px); }
      .actions a:focus-visible { outline: 2px solid #1f45b0; outline-offset: 4px; }

      @media (max-width: 480px) {
        .actions { align-items: stretch; flex-direction: column; }
      }

      @media (prefers-reduced-motion: reduce) {
        .actions a { transition: none; }
        .actions a:hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/" aria-label="Motify home">
        <img src="/logo.svg" alt="" />
        <span>Motify</span>
      </a>
      <a href="mailto:support@motify.video">support@motify.video</a>
    </header>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>This frame is missing.</h1>
      <p class="copy">The page may have moved, the link may be outdated, or this scene was never rendered.</p>
      <nav class="actions" aria-label="Page recovery">
        <a href="/">Return home</a>
        <a href="/pricing">View pricing</a>
      </nav>
    </main>
  </body>
</html>
