<div id="top">
  <app-navbar />
  <main>
    <app-hero-section />
    <app-hero-reel />
    <app-trust-strip />
    <app-highlights-carousel />
    <app-solutions-section />
    <app-feature-bento />

    <section id="get-started" class="workflow" aria-labelledby="workflow-title">
      <div class="workflow__heading">
        <h2 id="workflow-title" class="lp-title">Start from a template.</h2>
        <a class="workflow__view-all" routerLink="/templates">
          View all templates
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10m0 0L9 4m4 4-4 4" /></svg>
        </a>
      </div>
      <div class="workflow__gallery">
        @for (template of featuredTemplates; track template.slug) {
          <a class="workflow__template" [routerLink]="['/templates', template.slug]">
            <div class="workflow__template-media" [style.aspect-ratio]="template.aspect">
              <video
                [appLazyVideo]="template.video"
                aria-hidden="true"
                muted
                [muted]="true"
                [volume]="0"
                loop
                playsinline
              ></video>
            </div>
            <h3>{{ template.title }}</h3>
          </a>
        }
      </div>
    </section>

    <app-teams-section />

    <section id="faq" class="faq" aria-labelledby="faq-title">
      <h2 id="faq-title" class="lp-title">Questions, answered.</h2>
      <div class="faq__list">
        @for (faq of faqs; track faq.question) {
          <details>
            <summary>{{ faq.question }}</summary>
            <p>{{ faq.answer }}</p>
          </details>
        }
      </div>
    </section>

    <section id="resources">
      <app-resources-section />
    </section>
  </main>
  <app-footer />
</div>
