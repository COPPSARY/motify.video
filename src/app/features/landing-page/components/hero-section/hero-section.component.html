<section class="hero" aria-labelledby="hero-title">
  <app-aurora
    class="hero__aurora"
    [colorStops]="auroraColors"
    [amplitude]="0.9"
    [blend]="0.55"
    [height]="0.42"
    [speed]="0.7"
    [glow]="0.55"
  />
  <div class="hero__content">
    <h1 id="hero-title" class="hero__headline">
      <span class="hero__line"><span style="--rise-delay: 0ms">Create <span class="hero__word">@for (letter of motionLetters; track $index) {<span class="hero__letter" [style.--i]="$index">{{ letter }}</span>}</span></span></span>
      <span class="hero__line"><span style="--rise-delay: 90ms">&#32;graphics <span class="hero__dim">in minutes.</span></span></span>
    </h1>
    <p class="hero__subheadline hero__rise" style="--rise-delay: 420ms">
      For businesses, marketing teams, and agencies. Describe your idea and get an animated ad, product animation, or
      explainer you can refine and publish anywhere.
    </p>

    <app-prompt-composer class="hero__composer hero__rise" style="--rise-delay: 520ms" inputId="motion-prompt" />

    <div
      #chipRow
      class="hero__chips hero__rise"
      style="--rise-delay: 620ms"
      role="group"
      aria-label="Try an example"
      [style.--pill-x.px]="pill().x"
      [style.--pill-w.px]="pill().w"
      [class.has-pill]="pill().w > 0"
    >
      <span class="hero__pill" aria-hidden="true"></span>
      @for (demo of store.demos; track demo.id) {
        <button
          type="button"
          class="hero__chip"
          [class.is-active]="store.active().id === demo.id"
          [attr.aria-pressed]="store.active().id === demo.id"
          (click)="choose(demo.id, chip)"
          #chip
        >
          {{ demo.label }}
        </button>
      }
    </div>
  </div>
</section>
