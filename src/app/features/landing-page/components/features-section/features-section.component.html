<section class="features">
  <div class="features__inner">
    <div class="features__workflow" [appScrollReveal]="120">
      <div class="features__workflow-copy">
      <h2>With Motify, everything stays <span class="heading-accent heading-typed">editable.</span></h2>
      </div>

      <div class="features__grid">
        @for (feature of features; track feature.id; let i = $index) {
          <article class="feature-card" [class]="'feature-card feature-card--' + feature.icon" [appScrollReveal]="i * 50">
            <div class="feature-card__top">
              <span class="feature-card__icon" aria-hidden="true">
                @switch (feature.icon) {
                  @case ('mouse-pointer') {
                    <svg class="feature-card__icon-svg" lucideMousePointer2></svg>
                  }
                  @case ('code') {
                    <svg class="feature-card__icon-svg" lucideCode2></svg>
                  }
                  @case ('timeline') {
                    <svg class="feature-card__icon-svg" lucideTimerReset></svg>
                  }
                  @case ('download') {
                    <svg class="feature-card__icon-svg" lucideDownload></svg>
                  }
                  @default {
                    <svg class="feature-card__icon-svg" lucideSparkles></svg>
                  }
                }
              </span>
              <h3 class="feature-card__title">{{ feature.title }}</h3>
            </div>

            <p class="feature-card__description">{{ feature.description }}</p>

            <div class="feature-card__visual" aria-hidden="true">
              <img
                [src]="visualAsset(feature.icon)"
                [alt]="feature.title + ' visual'"
                loading="lazy"
              />
            </div>
          </article>
        }
      </div>
    </div>
  </div>
</section>
