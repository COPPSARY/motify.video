<section class="hero" aria-labelledby="hero-title">
  <app-aurora
    class="hero__aurora"
    [colorStops]="auroraColors"
    [amplitude]="1"
    [blend]="0.5"
    [height]="0.45"
    [speed]="1"
    [glow]="0.6"
  />
  <div class="hero__content" [appScrollReveal]="0">
    <h1 id="hero-title" class="hero__headline">
      Create motion graphics in minutes.
    </h1>
    <p class="hero__subheadline">
      For businesses, marketing teams, and agencies. Describe your idea and get an animated ad, product animation, or explainer you can refine and publish anywhere.
    </p>
    <app-prompt-composer
      class="hero__composer"
      inputId="motion-prompt"
      [placeholder]="typedPrompt() || 'Describe your video, or paste your script in plain words…'"
    />
  </div>
</section>
