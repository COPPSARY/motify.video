<section id="showcase" class="showcase-stories" aria-labelledby="showcase-stories-title">
  <header class="showcase-stories__intro">
    <div class="showcase-stories__trust" aria-label="Recognized and supported by partners">
      <span>Recognized &amp; Supported By</span>
      <div class="showcase-stories__trust-logos">
        <a href="https://cloud.google.com/" target="_blank" rel="noopener noreferrer" aria-label="Google Cloud">
          <img class="showcase-stories__google-logo" src="/assets/google-cloud-icon.svg" alt="Google Cloud" width="30" height="24" loading="lazy" />
        </a>
        <a href="https://www.kiritts.com/?locale=en" target="_blank" rel="noopener noreferrer" aria-label="KiriTTS">
          <img src="/assets/kiritts-logo.svg" alt="" width="32" height="32" loading="lazy" />
          <strong>KiriTTS</strong>
        </a>
      </div>
    </div>
    <h2 id="showcase-stories-title">Made with <span class="heading-accent">Motify.</span></h2>
  </header>

  <div class="showcase-stories__layout">
    <aside class="showcase-stories__rail" aria-label="Showcase categories">
      <div class="showcase-stories__rail-inner">
        <nav>
          @for (story of stories; track story.id) {
            <button
              type="button"
              class="showcase-stories__rail-btn"
              [class.is-active]="activeStory() === story.id"
              [attr.aria-current]="activeStory() === story.id ? 'true' : null"
              (click)="selectStory(story.id, $event)"
            >
              <span class="showcase-stories__rail-label">{{ story.category }}</span>
            </button>
          }
        </nav>
      </div>
    </aside>

    <div class="showcase-stories__chapters">
      @for (story of stories; track story.id) {
        <article
          #storyPanel
          [id]="story.id"
          class="showcase-story"
          [class.is-active]="activeStory() === story.id"
          [attr.aria-label]="story.category"
        >
          <p class="showcase-story__description">{{ story.description }}</p>
          <div class="showcase-story__gallery">
            @for (video of story.videos; track video.src) {
              <div class="showcase-story__media">
                <video
                  #showcaseVideo
                  [src]="video.src"
                  [poster]="video.poster"
                  [attr.aria-label]="video.label"
                  autoplay
                  loop
                  muted
                  playsinline
                  preload="metadata"
                  (canplay)="playVideo($event)"
                ></video>
              </div>
            }
          </div>
        </article>
      }
    </div>
  </div>
</section>
