<nav class="navbar" [class.navbar--scrolled]="scrolled()">
  <a class="navbar__brand" routerLink="/" aria-label="Motify home">
    <img class="navbar__logo" [src]="logoSrc" alt="Motify" width="120" height="28" />
  </a>

  <div class="navbar__links" [class.navbar__links--open]="menuOpen()" id="site-navigation">
    <a class="navbar__link" href="#top" (click)="closeMenu()">
      <svg lucideHome aria-hidden="true"></svg>
      <span>Home</span>
    </a>
    <a class="navbar__link" routerLink="/pricing" routerLinkActive="navbar__link--active" (click)="closeMenu()">
      <svg class="navbar__link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v10M15 9.5c-.7-.5-1.5-.75-2.5-.75h-1a1.5 1.5 0 0 0 0 3h1a1.5 1.5 0 0 1 0 3h-1c-1 0-1.8-.25-2.5-.75" />
      </svg>
      <span>Pricing</span>
    </a>
    <a class="navbar__link" [href]="editorHref()" (click)="closeMenu()">
      <span>Editor</span>
      <svg lucideArrowUpRight aria-hidden="true"></svg>
    </a>
    @if (auth.user(); as user) {
      <div class="navbar__account-wrap" (click)="$event.stopPropagation()">
        <button
          class="navbar__account"
          type="button"
          [attr.aria-expanded]="accountMenuOpen()"
          aria-haspopup="menu"
          (click)="toggleAccountMenu($event)"
        >
          <span class="navbar__avatar" aria-hidden="true">
            @if (user.avatarUrl) {
              <img [src]="user.avatarUrl" alt="" width="28" height="28" />
            } @else {
              {{ userInitials(user) }}
            }
          </span>
          <span class="navbar__account-name">{{ user.displayName || user.email }}</span>
          @if (activePlan(); as plan) {
            <span class="navbar__plan-badge">{{ plan }}</span>
          }
          <svg lucideChevronDown aria-hidden="true"></svg>
        </button>
        @if (accountMenuOpen()) {
          <div class="navbar__account-menu" role="menu">
            <div class="navbar__account-identity">
              <strong>{{ user.displayName || 'Motify account' }}</strong>
              <span>{{ user.email }}</span>
            </div>
            <a class="navbar__account-item" role="menuitem" [href]="editorHref()" (click)="closeMenu()">
              <span>Open Editor</span>
              <svg lucideArrowUpRight aria-hidden="true"></svg>
            </a>
            <button class="navbar__account-item navbar__account-item--danger" role="menuitem" type="button" [disabled]="loggingOut()" (click)="logoutAccount()">
              <svg lucideLogOut aria-hidden="true"></svg>
              <span>{{ loggingOut() ? 'Logging out…' : 'Log out' }}</span>
            </button>
          </div>
        }
      </div>
    } @else {
      <a class="navbar__link" routerLink="/login" (click)="closeMenu()">
        <svg lucideLogIn aria-hidden="true"></svg>
        <span>Log in</span>
      </a>
      <a class="navbar__link navbar__link--cta" routerLink="/signup" (click)="closeMenu()">
        <span>Sign up</span>
      </a>
    }
    <div class="navbar__mobile-badges">
      <app-product-hunt-badge size="compact" />
      <app-github-star-badge size="compact" />
    </div>
  </div>

  <div class="navbar__actions">
    <app-product-hunt-badge size="compact" />
    <app-github-star-badge size="compact" />
    <button
      class="navbar__toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="site-navigation"
      aria-label="Toggle navigation"
      (click)="toggleMenu()"
    >
      @if (menuOpen()) {
        <svg lucideX aria-hidden="true"></svg>
      } @else {
        <svg lucideMenu aria-hidden="true"></svg>
      }
    </button>
  </div>
</nav>
