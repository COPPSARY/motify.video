<form class="composer" (ngSubmit)="submitPrompt()">
  <label class="sr-only" [for]="inputId()">Describe your video</label>
  <textarea
    #promptInput
    [id]="inputId()"
    name="prompt"
    rows="3"
    [ngModel]="prompt()"
    (ngModelChange)="onPromptInput($event)"
    [placeholder]="placeholder()"
    (keydown)="onPromptKeydown($event)"
  ></textarea>
  <div class="composer__actions">
    <span class="composer__hint" aria-hidden="true"><kbd>Enter</kbd> to create</span>
    <button class="composer__submit" type="submit" [disabled]="!prompt().trim()">
      <span>Create</span>
      <svg lucideArrowUp aria-hidden="true"></svg>
    </button>
  </div>
</form>
