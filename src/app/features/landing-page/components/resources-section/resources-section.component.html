<section class="resources">
  <div class="resources__inner">
    <div class="resources__copy" [appScrollReveal]="0">
      <h2>Everything to ship <span class="heading-accent heading-typed">motion.</span></h2>
      <p>Make an ad, refine it, and ship it anywhere.</p>
    </div>

    <div class="resources__grid" [appScrollReveal]="80">
      @for (resource of resources; track resource.id; let i = $index) {
        <app-external-link-card [resource]="resource" [appScrollReveal]="i * 60" />
      }
    </div>

    <div class="resources__cta" [appScrollReveal]="140">
      <div>
        <span>Start free. No card.</span>
        <strong>Ready to ship?</strong>
        <p>Paste a link. Refine the result.</p>
      </div>
      <form class="resources__composer" (ngSubmit)="submitPrompt()">
        <label class="sr-only" for="resources-prompt">Describe your video</label>
        <textarea
          id="resources-prompt"
          name="resourcesPrompt"
          [(ngModel)]="prompt"
          rows="2"
          placeholder="Describe your video..."
          (keydown)="onPromptKeydown($event)"
        ></textarea>
        <div class="resources__composer-actions">
          <div class="resources__asset-picker">
            <button class="resources__round-button" type="button" aria-label="Add an asset" [attr.aria-expanded]="assetMenuOpen" (click)="toggleAssetMenu()"><svg lucidePlus aria-hidden="true"></svg></button>
            @if (assetMenuOpen) {
              <div class="resources__asset-menu">
                <button type="button" (click)="chooseAsset('image')">Upload image</button>
                <button type="button" (click)="chooseAsset('video')">Upload video</button>
              </div>
            }
          </div>
          @if (selectedAsset) { <span class="resources__asset-name" title="Attached asset">{{ selectedAsset }}</span> }
          <button class="resources__enhance-button" type="button" aria-label="Enhance prompt" title="Enhance prompt" (click)="enhancePrompt()"><svg lucideSparkles aria-hidden="true"></svg></button>
          <button class="resources__submit" type="submit" aria-label="Start creating"><svg lucideArrowUp aria-hidden="true"></svg></button>
        </div>
      </form>
    </div>
  </div>
</section>
