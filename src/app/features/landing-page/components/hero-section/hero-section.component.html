<section class="hero" aria-labelledby="hero-title">
  <div class="hero__content" [appScrollReveal]="0">
    <h1 id="hero-title" class="hero__headline">
      Create motion graphics in minutes.
    </h1>
    <p class="hero__subheadline">
      Built for growing teams. Describe your video and get a polished, on-brand cut you can refine and publish anywhere.
    </p>
    <form class="hero__composer" (ngSubmit)="submitPrompt()">
      <label class="sr-only" for="motion-prompt">Describe your video</label>
      <textarea
        id="motion-prompt"
        name="prompt"
        [(ngModel)]="prompt"
        rows="2"
        [placeholder]="typedPrompt() || 'Describe your video...'"
        (keydown)="onPromptKeydown($event)"
      ></textarea>
      <div class="hero__composer-actions">
        <div class="hero__asset-picker">
          <button class="hero__round-button" type="button" aria-label="Add an asset" [attr.aria-expanded]="assetMenuOpen" (click)="toggleAssetMenu()">
            <svg lucidePlus aria-hidden="true"></svg>
          </button>
          @if (assetMenuOpen) {
            <div class="hero__asset-menu">
              <button type="button" (click)="chooseAsset('image')">Upload image</button>
              <button type="button" (click)="chooseAsset('audio')">Add music</button>
            </div>
          }
        </div>
        @if (selectedAsset) {
          <span class="hero__asset-name" title="Attached asset">{{ selectedAsset }}</span>
        }
        <button class="hero__enhance-button" type="button" aria-label="Enhance prompt" title="Enhance prompt" (click)="enhancePrompt()">
          <svg lucideSparkles aria-hidden="true"></svg>
        </button>
        <button class="hero__submit" type="submit" aria-label="Create video">
          <svg lucideArrowUp aria-hidden="true"></svg>
        </button>
      </div>
    </form>
  </div>

</section>
